[package]
name = "aethium"
version = "1.3.0"
authors = ["Aethium Contributors"]
description = " a dynamically typed, object-oriented programming language which is compiled to bytecode."

[dependencies]

[linter]
max_line_length = 100
enable_rules = ["unused-variable", "line-length", "no-bare-except", "syntax-check", "undefined-global"]

